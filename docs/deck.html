<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deck</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  iframe { position:fixed; inset:0; width:100vw; height:100vh; border:0; }
  #fs { position:fixed; top:12px; right:12px; z-index:2; padding:8px 12px; font:14px system-ui,sans-serif;
        color:#fff; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.35); border-radius:6px;
        cursor:pointer; opacity:.75; }
  #fs:hover { opacity:1; }
  :fullscreen #fs { display:none; }
</style>
</head><body>
<iframe src="https://cue.humanmeetsai.com/embed/7ad12877-ad41-4786-84e2-cec31f1015cc" allowfullscreen allow="fullscreen" loading="eager" title="cue deck"></iframe>
<button id="fs" type="button">Fullscreen</button>
<script>
  document.getElementById('fs').onclick = () => document.documentElement.requestFullscreen?.();
</script>
</body></html>
